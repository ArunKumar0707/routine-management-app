<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DayFlow — 24-Hour Routine Planner</title>
<meta name="theme-color" content="#4f6bed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3" opacity=".25"/>
      <path d="M16 3a13 13 0 0 1 13 13" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="M16 9v7l4.5 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-name">DayFlow</span>
  </div>

  <div class="header-routine">
    <label class="sr-only" for="routineSelect">Routine</label>
    <select id="routineSelect" class="select"></select>
    <span id="routineName" class="routine-name" aria-live="polite"></span>
  </div>

  <div class="header-actions">
    <label class="sr-only" for="dateInput">Date</label>
    <input type="date" id="dateInput" class="input date-input">
    <button class="btn icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn primary" id="createBtn">+ Create Activity</button>
  </div>
</header>

<section class="quote-wrap" aria-label="Motivational quote">
  <div class="quote-card">
    <div class="quote-mark" aria-hidden="true">“</div>
    <div class="quote-body" id="quoteBody" aria-live="polite">
      <p class="quote-text" id="quoteText"></p>
      <p class="quote-author" id="quoteAuthor"></p>
    </div>
    <div class="quote-controls">
      <label class="sr-only" for="quoteEvery">Change quote every</label>
      <select id="quoteEvery" class="select" title="How often the quote changes">
        <option value="1">Every minute</option>
        <option value="5">Every 5 min</option>
        <option value="15">Every 15 min</option>
        <option value="30">Every 30 min</option>
        <option value="60">Every hour</option>
        <option value="1440">Every day</option>
      </select>
      <button class="btn icon-btn" id="quoteNext" type="button" title="Show another quote" aria-label="Show another quote">↻</button>
    </div>
  </div>
</section>

<main class="layout">
  <section class="card timeline-card">
    <div class="card-head">
      <div>
        <h2>Your 24 hours</h2>
        <p class="muted" id="timelineSubtitle"></p>
      </div>
      <div class="segmented" role="tablist" aria-label="Timeline view">
        <button role="tab" id="viewVertical" class="seg active">Vertical</button>
        <button role="tab" id="viewCircular" class="seg">Circular</button>
      </div>
    </div>
    <div id="conflictBanner" class="banner warn hidden"></div>
    <div id="timelineHost" class="timeline-host"></div>
    <div id="detailsPanel" class="details-panel">
      <p class="muted">Select an activity to see its details.</p>
    </div>
  </section>

  <aside class="side">
    <section class="card">
      <h3>Daily summary</h3>
      <div id="statsGrid" class="stats-grid"></div>
      <p id="statsNote" class="muted small"></p>
    </section>

    <section class="card">
      <h3>Category breakdown</h3>
      <div id="breakdown" class="breakdown"></div>
    </section>

    <section class="card" id="alertsCard">
      <h3>Alerts</h3>
      <label class="switch-row"><input type="checkbox" id="alertEnabled"> Alert when an activity starts</label>
      <label class="switch-row"><input type="checkbox" id="alertSound"> Play a tone</label>
      <label class="switch-row"><input type="checkbox" id="alertNotify"> Show a notification</label>
      <label class="switch-row" id="alertAwakeRow"><input type="checkbox" id="alertAwake"> Keep screen on while open (recommended on phones)</label>
      <div class="alert-grid">
        <label class="field">Tone
          <select id="alertTone" class="select">
            <option value="chime">Chime</option>
            <option value="beep">Beep</option>
            <option value="bell">Bell</option>
          </select>
        </label>
        <label class="field">Notify
          <select id="alertLead" class="select">
            <option value="0">At start time</option>
            <option value="5">5 min before</option>
            <option value="10">10 min before</option>
            <option value="15">15 min before</option>
          </select>
        </label>
      </div>
      <p class="muted small" id="soundHelp"></p>
      <div class="btn-grid"><button class="btn" id="alertTest" type="button">Test alert</button><button class="btn" id="soundRefresh" type="button">Refresh sounds</button></div>
      <p class="small" id="alertNext"></p>
      <p class="muted small" id="alertStatus"></p>
    </section>

    <section class="card">
      <h3>Routines</h3>
      <div class="btn-grid">
        <button class="btn" id="newRoutineBtn">New</button>
        <button class="btn" id="renameRoutineBtn">Rename</button>
        <button class="btn" id="dupRoutineBtn">Duplicate</button>
        <button class="btn danger" id="delRoutineBtn">Delete</button>
      </div>
      <h3 class="sub">Data</h3>
      <div class="btn-grid">
        <button class="btn" id="backupBtn">Export JSON</button>
        <button class="btn" id="importBtn">Import JSON</button>
        <button class="btn" id="sampleBtn">Load sample</button>
        <button class="btn danger" id="resetBtn">Reset all</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
    </section>
  </aside>
</main>


<!-- Activity list (also useful on mobile) -->
<section class="card list-card" id="listCard">
  <h3>Activities</h3>
  <div id="activityRows" class="activity-rows"></div>
</section>

<!-- Activity modal -->
<dialog id="activityModal" class="modal">
  <form id="activityForm" method="dialog" novalidate>
    <h2 id="activityModalTitle">Create Activity</h2>
    <div class="form-grid">
      <label class="field full">Name *
        <input id="fName" class="input" maxlength="60" placeholder="e.g. Morning run" autocomplete="off">
        <span class="err" id="errName"></span>
      </label>
      <label class="field">Category
        <select id="fCategory" class="select"></select>
      </label>
      <label class="field">Color
        <input type="color" id="fColor" class="input color">
      </label>
      <label class="field full check"><input type="checkbox" id="fDefaultColor"> Use this color as the default for the category</label>
      <div class="field" role="group" aria-label="Start time">Start time
        <div id="fStart" class="timepick"></div>
      </div>
      <div class="field" role="group" aria-label="End time">End time
        <div id="fEnd" class="timepick"></div>
      </div>
      <p class="duration full" id="fDuration"></p>
      <span class="err full" id="errTime"></span>
      <label class="field">Icon
        <select id="fIcon" class="select"></select>
      </label>
      <label class="field">Repeat
        <select id="fRepeat" class="select">
          <option value="none">Does not repeat (selected date only)</option>
          <option value="daily">Daily</option>
          <option value="weekdays">Weekdays</option>
          <option value="weekends">Weekends</option>
        </select>
      </label>
      <label class="field full">Notes
        <textarea id="fNotes" class="input" rows="2" maxlength="300" placeholder="Optional"></textarea>
      </label>
    </div>
    <div id="conflictBox" class="banner warn hidden"></div>
    <div class="modal-actions">
      <button type="button" class="btn danger left hidden" id="fDelete">Delete</button>
      <button type="button" class="btn" id="fCancel">Cancel</button>
      <button type="submit" class="btn primary" id="fSave">Save</button>
    </div>
  </form>
</dialog>

<!-- Generic prompt / confirm modal -->
<dialog id="dialogModal" class="modal small-modal">
  <form method="dialog" id="dialogForm">
    <h2 id="dialogTitle"></h2>
    <p id="dialogMsg" class="muted"></p>
    <input id="dialogInput" class="input hidden" maxlength="60">
    <div class="modal-actions">
      <button type="button" class="btn" id="dialogCancel">Cancel</button>
      <button type="submit" class="btn primary" id="dialogOk">OK</button>
    </div>
  </form>
</dialog>

<!-- New routine modal -->
<dialog id="newRoutineModal" class="modal small-modal">
  <form method="dialog" id="newRoutineForm">
    <h2>New routine</h2>
    <label class="field">Name
      <input id="nrName" class="input" maxlength="60" placeholder="e.g. Study Routine">
    </label>
    <label class="field">Start from
      <select id="nrTemplate" class="select">
        <option value="blank">Blank schedule</option>
        <option value="sample">Sample routine</option>
      </select>
    </label>
    <div class="modal-actions">
      <button type="button" class="btn" id="nrCancel">Cancel</button>
      <button type="submit" class="btn primary">Create</button>
    </div>
  </form>
</dialog>

<!-- Export modal -->
<dialog id="exportModal" class="modal wide-modal">
  <h2>Export as image</h2>
  <div class="export-controls">
    <div class="segmented">
      <button class="seg active" id="expPortrait">Portrait 2160×3840</button>
      <button class="seg" id="expLandscape">Landscape 3840×2160</button>
    </div>
    <div class="segmented">
      <button class="seg active" id="expThemeLight">Light</button>
      <button class="seg" id="expThemeDark">Dark</button>
    </div>
  </div>
  <div class="export-preview"><canvas id="exportPreview"></canvas></div>
  <p class="muted small" id="exportStatus"></p>
  <div class="modal-actions">
    <button class="btn" id="expClose">Close</button>
    <button class="btn primary" id="expDownload">Download PNG</button>
  </div>
</dialog>

<div id="tooltip" class="tooltip hidden" role="tooltip"></div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="alertStack" class="alert-stack" aria-live="assertive"></div>

<script src="app.js"></script>
<script src="sounds/sounds.js"></script>
<script src="quotes.js"></script>
<script src="alerts.js"></script>
</body>
</html>
